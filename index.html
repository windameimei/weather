<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather Dashboard | Micro-interactions</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="dashboard">
        <!-- Panel Utama Kiri -->
        <main class="main-panel">
            <!-- Header & Search -->
            <header class="header">
                <div class="location-time">
                    <h1 class="location" id="locationDisplay">Tokyo, Japan</h1>
                    <span class="time-condition" id="timeCondition">Dusk · Clear Sky</span>
                </div>
                <div class="search-bar">
                    <input type="text" id="citySearch" placeholder="Cari kota...">
                    <button id="searchBtn" aria-label="Cari kota">🔍</button>
                </div>
            </header>

            <!-- Hero Temperature -->
            <div class="hero-card glass" id="heroCard">
                <div class="temp-display">
                    <span class="temp-value" id="tempValue">18°</span>
                    <span class="temp-unit">C</span>
                </div>
                <div class="weather-desc" id="weatherDesc">Cerah Berawan</div>
            </div>

            <!-- Ambient Visual Container -->
            <div class="ambient-container glass" id="ambientContainer">
                <div class="ambient-visual" id="ambientVisual">
                    <!-- CSS-based weather effect will be applied here -->
                    <div class="weather-icon" id="weatherIcon">☀️</div>
                </div>
                <span class="ambient-label">Kondisi Saat Ini</span>
            </div>

            <!-- Data Cards Grid -->
            <div class="data-cards">
                <div class="data-card glass" id="humidityCard">
                    <div class="card-icon">💧</div>
                    <div class="card-info">
                        <span class="card-value" id="humidityValue">72%</span>
                        <span class="card-label">Kelembapan</span>
                    </div>
                </div>
                <div class="data-card glass" id="windCard">
                    <div class="card-icon">💨</div>
                    <div class="card-info">
                        <span class="card-value" id="windValue">14 km/h</span>
                        <span class="card-label">Angin</span>
                    </div>
                </div>
                <div class="data-card glass" id="uvCard">
                    <div class="card-icon">☀️</div>
                    <div class="card-info">
                        <span class="card-value" id="uvValue">5</span>
                        <span class="card-label">Indeks UV</span>
                    </div>
                </div>
            </div>
        </main>

        <!-- Sidebar Forecast 7 Hari -->
        <aside class="forecast-sidebar glass">
            <h2 class="sidebar-title">7 Hari Ke Depan</h2>
            <ul class="forecast-list" id="forecastList">
                <!-- Generated by JS -->
            </ul>
        </aside>
    </div>

    <script src="script.js" defer></script>
</body>
  </html>
